name: Native CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Tessera.Tests/Tessera.Tests.csproj -c Release --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results
          path: '**/TestResults/*.trx'
  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build native application
        run: dotnet build src/Tessera.App/Tessera.App.csproj -c Release
      - name: Native UI, visual, keyboard and real PTY tests
        run: dotnet test tests/Tessera.App.Tests/Tessera.App.Tests.csproj -c Release --logger trx --blame-hang-timeout 2m
      - name: Publish self-contained unsigned application
        run: dotnet publish src/Tessera.App/Tessera.App.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishTrimmed=false -o artifacts/app
      - name: Collect dependency notices
        run: python tools/collect_notices.py
      - name: Package native alpha with revision and checksums
        run: python tools/package.py --rid ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: Tessera-${{ matrix.rid }}-unsigned
          compression-level: 0
          path: artifacts/packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-validation-${{ matrix.rid }}
          path: |
            artifacts/screenshots
            **/TestResults/*.trx
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact source tree
        run: git archive --format=zip HEAD -o Tessera-native-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Tessera-source
          path: Tessera-native-source.zip
