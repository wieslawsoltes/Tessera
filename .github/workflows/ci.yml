name: Native CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tools/ApiProbe/ApiProbe.csproj
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Tessera.Tests/Tessera.Tests.csproj -c Release --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results
          path: '**/TestResults/*.trx'
