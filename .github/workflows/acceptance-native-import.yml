name: Validate native acceptance source
on:
  push:
    branches: [feature/acceptance-completion]
    paths: [.github/workflows/acceptance-native-import.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify exact reviewed source before changing files
        run: |
          python3 - <<'PY'
          import pathlib,base64,lzma,hashlib,subprocess
          root=pathlib.Path('eng/acceptance-transfer')
          parts=[root/f'part{i}.b64' for i in range(6)]
          text=''.join(''.join(p.read_text().split()) for p in parts)
          payload=base64.b64decode(text,validate=True)
          actual=hashlib.sha256(payload).hexdigest()
          print('XZ SHA256:',actual, 'Base64 characters:',len(text))
          assert actual=='b865cb7488b900c94320abfeae6607855cc6c62469b6662689118cd56840991a', 'Transfer mismatch; no source files modified.'
          patch=lzma.decompress(payload)
          assert hashlib.sha256(patch).hexdigest()=='aa7308cdc59492d33f7a2e2e5f21a617007d61d67c3fc93fbd9966c81f66042b'
          target=pathlib.Path('/tmp/tessera-acceptance.patch'); target.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(target)],check=True)
          subprocess.run(['git','apply','--index',str(target)],check=True)
          print('Materialized hash-verified native acceptance implementation.')
          PY
      - run: dotnet test tests/Tessera.Tests -c Release --logger trx
      - run: dotnet build src/Tessera.App -c Release -warnaserror
      - run: dotnet test tests/Tessera.App.Tests -c Release --logger trx --blame-hang-timeout 3m
      - name: Commit validated implementation and remove temporary transfer files
        run: |
          git rm -r eng/acceptance-transfer .github/workflows/acceptance-native-import.yml
          git -c user.name='Tessera CI' -c user.email='tessera-ci@users.noreply.github.com' commit -m 'feat: complete native terminal acceptance workflows and release validation'
          git push origin HEAD:feature/acceptance-completion
          git archive --format=zip --prefix=Tessera/ HEAD -o /tmp/Tessera-acceptance-source.zip
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-source-transfer-verification
          path: |
            eng/acceptance-transfer/*.b64
            **/TestResults/*.trx
            /tmp/Tessera-acceptance-source.zip
          include-hidden-files: true
          retention-days: 3
