name: Offline acceptance kit parts
on:
  push:
    paths: ['.github/workflows/devkit-parts.yml']
permissions:
  contents: read
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34905526530
          name: offline-acceptance-kit
          path: kit
      - run: |
          mkdir parts
          split -b 250M kit/packages.tar.gz parts/packages.part-
      - uses: actions/upload-artifact@v4
        with:
          name: kit-sdk
          path: kit/sdk.tar.gz
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: kit-apis
          path: kit/apis.tar.gz
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: kit-packages-aa
          path: parts/packages.part-aa
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: kit-packages-ab
          path: parts/packages.part-ab
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: kit-packages-ac
          path: parts/packages.part-ac
          compression-level: 0
          retention-days: 3
