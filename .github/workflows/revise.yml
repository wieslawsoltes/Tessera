name: Native interaction hardening
on:
  push:
    branches: [main]
    paths: [tools/revise.py]
permissions:
  contents: write
jobs:
  harden-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python3 tools/revise.py
      - name: Commit native fixes
        run: |
          git rm tools/revise.py .github/workflows/revise.yml
          git add src
          git -c user.name='Tessera CI' -c user.email='tessera-ci@users.noreply.github.com' commit -m 'fix: guard recycled palette templates and use embedded design typography'
          git push origin HEAD:main
          git rev-parse HEAD
      - run: dotnet test tests/Tessera.App.Tests/Tessera.App.Tests.csproj -c Release --logger trx --blame-hang-timeout 2m
      - run: dotnet publish src/Tessera.App/Tessera.App.csproj -c Release -r linux-x64 --self-contained true -p:PublishTrimmed=false -o artifacts/app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-interaction-validation
          path: |
            artifacts/screenshots
            **/TestResults/*.trx
      - uses: actions/upload-artifact@v4
        with:
          name: Tessera-linux-x64-hardened
          path: artifacts/app
