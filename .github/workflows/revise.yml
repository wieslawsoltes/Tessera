name: Native source revision
on:
  push:
    branches: [main]
    paths: [tools/revise.py]
permissions:
  contents: write
jobs:
  revise-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python3 tools/revise.py
      - name: Commit API correction
        run: |
          git rm tools/revise.py .github/workflows/revise.yml
          git add src
          git -c user.name='Tessera CI' -c user.email='tessera-ci@users.noreply.github.com' commit -m 'fix: observe Avalonia profile selection notifications correctly'
          git push origin HEAD:main
          git rev-parse HEAD
      - run: dotnet test tests/Tessera.App.Tests/Tessera.App.Tests.csproj -c Release --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-validation
          path: |
            artifacts/screenshots
            **/TestResults/*.trx
