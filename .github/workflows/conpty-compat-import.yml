name: ConPTY compatibility source validation
on:
  push:
    branches: [fix/pty-result-completeness]
    paths: [.github/workflows/conpty-compat-import.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - run: python tools/update_conpty_compat.py
      - name: Wire production and test factories without a shell-redirection workaround
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/Tessera.App/Services/TesseraPtyFactory.cs')
          assert not p.exists()
          p.write_text('''using RoyalTerminal.Terminal;
          namespace Tessera.Services;
          /// <summary>Preserves RoyalTerminal PTY behavior with isolated Windows standard handles.</summary>
          public sealed class TesseraPtyFactory : IPtyFactory
          {
              public IPty Create() => OperatingSystem.IsWindows()
                  ? new Compatibility.WindowsPty()
                  : new DefaultPtyFactory().Create();
          }
          ''')
          p=Path('src/Tessera.App/Services/GuardedTerminal.cs');s=p.read_text();assert s.count('new DefaultPtyFactory()')==2;p.write_text(s.replace('new DefaultPtyFactory()', 'new TesseraPtyFactory()'))
          p=Path('tests/Tessera.App.Tests/PtyTransportTests.cs');s=p.read_text();assert 'new DefaultPtyFactory()' in s;p.write_text(s.replace('using RoyalTerminal.Terminal;', 'using RoyalTerminal.Terminal;\nusing Tessera.Services;').replace('new DefaultPtyFactory()', 'new TesseraPtyFactory()'))
          p=Path('tests/Tessera.App.Tests/PtyTestFixture.cs');s=p.read_text();assert 'echo started>pty-started.txt' in s;s=s.replace('echo started>pty-started.txt\\r\\n', '').replace('echo {ready}>CONOUT$\\r\\n', '');p.write_text(s)
          Path('src/Tessera.App/Services/Compatibility/README.md').write_text('''# Windows ConPTY standard-handle isolation

          The two C# files in this directory are derived from RoyalTerminal at
          `b740171f3d0ff6e97a1fcc1f58cc311f5dd4507f`, under the included MIT license.
          `tools/update_conpty_compat.py` records and verifies the original SHA-256
          hashes. It is a maintenance utility, not invoked by normal builds.

          The behavioral patch sets STARTF_USESTDHANDLES with NULL stdin/stdout/stderr
          in the child STARTUPINFO. Without it, a parent launched with redirected
          streams (including CI and IDE test hosts) can cause ConPTY children to use
          those streams instead of their pseudoconsole. bInheritHandles=false is
          insufficient. No process-global handles are modified and no shell wrappers
          or binary patching are used. Namespace and type visibility isolate the copy.

          Primary explanation and workaround from the Windows Terminal maintainers:
          https://github.com/microsoft/terminal/discussions/15814

          TesseraPtyFactory supplies this implementation to the normal application
          and its raw-transport regression; Unix uses the unchanged upstream factory.
          Retire this compatibility copy when the pinned upstream dependency provides
          and verifies the same launch policy. Keep the discovery/result-completeness
          gate: a successful test process exit is not proof that every case reported.
          ''')
          PY
      - run: dotnet build src/Tessera.App -c Release -warnaserror
      - run: python tools/run_native_validation.py
      - name: Commit verified sources
        run: |
          git rm .github/workflows/conpty-compat-import.yml
          git add src/Tessera.App/Services tests/Tessera.App.Tests
          git -c user.name='Tessera CI' -c user.email='tessera-ci@users.noreply.github.com' commit -m 'fix(windows): isolate ConPTY child streams from redirected parent handles'
          git push origin HEAD:fix/pty-result-completeness
          git rev-parse HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: conpty-compat-source-validation
          path: artifacts/test-evidence
