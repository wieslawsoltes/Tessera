name: PTY result diagnostics
on:
  push:
    branches: [fix/pty-result-completeness]
    paths: ['.github/workflows/pty-diagnostics.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Discover all native test cases
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/pty-diagnostics | Out-Null
          dotnet test tests/Tessera.App.Tests -c Release --list-tests 2>&1 | Tee-Object artifacts/pty-diagnostics/discovery.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the two PTY tests in isolation
        shell: pwsh
        run: |
          dotnet test tests/Tessera.App.Tests -c Release --no-build --filter 'FullyQualifiedName~LocalTerminalExecutesAnActualPtyCommand|FullyQualifiedName~LivePtySurvivesTwoNativeWindowTransfersAndAsyncDisposal' --logger 'trx;LogFileName=pty.trx' --logger 'console;verbosity=detailed' --results-directory artifacts/pty-diagnostics --diag artifacts/pty-diagnostics/vstest.log --blame-hang-timeout 2m 2>&1 | Tee-Object artifacts/pty-diagnostics/execution.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pty-result-diagnostics
          path: artifacts/pty-diagnostics
          retention-days: 3
